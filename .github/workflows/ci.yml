name: Validar projeto

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  teste:
    name: Compilar e testar
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Executar testes
        run: mvn --batch-mode verify
